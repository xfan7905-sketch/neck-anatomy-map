const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const narrow = matchMedia("(max-width:660px)");
const chapterById = Object.fromEntries(chapters.map(chapter => [chapter.id,chapter]));
const overviewText = [
 ["下颌骨","下巴和下脸的骨架。下颌骨下面可以找到下颌下三角。"],
 ["舌骨","下巴下、喉上方的一块小骨。它把颈前区分成舌骨上区和舌骨下区。"],
 ["胸锁乳突肌","从耳后斜向胸骨和锁骨。看它的表面、前缘和后缘，就能给很多神经血管定位。"],
 ["气管","颈前中线深处的空气通道。食管在它后方，甲状腺在它前外侧。"],
 ["锁骨","颈部和肩部交界的横向地标。锁骨附近是颈部、上肢和胸腔线路交会的地方。"]
];
const state = {chapter:null,view:"overview",route:null,step:0,playing:false,elapsed:0,raf:0,compare:null};
const frameDuration = 3800;
let traceFrame = [];
const cssColor = type => `--tone:${colors[type]}`;
const chip = (name, key, value, current) => `<button class="chip" data-${key}="${value}" aria-pressed="${value===current}">${name}</button>`;
const note = ([title,body]) => `<div class="note"><h3>${title}</h3><p>${body}</p></div>`;
const currentFigure = () => figures[state.view];
const setStatus = text => { $("announce").textContent = text; };
const moveToStudy = () => $("study").scrollIntoView({block:"start",behavior:reduced.matches?"auto":"smooth"});

function moveRoutePicker() {
 const routes = $("routes");
 if (narrow.matches) $("stage").before(routes);
 else $("route-info").before(routes);
}

function renderNavigation() {
 $("lessons").innerHTML = chapters.map(chapter =>
  `<button class="lesson" data-chapter="${chapter.id}" aria-pressed="${state.chapter===chapter}">${chapter.name}</button>`).join("");
 $("overview").hidden = !state.chapter;
}

function loadChapter(id, scroll=true) {
 halt();
 state.chapter = chapterById[id] ?? null;
 state.route = state.chapter?.routes[0] ?? null;
 state.view = state.chapter?.views[0] ?? "overview";
 state.step = 0;
 state.compare = null;
 state.elapsed = 0;
 renderNavigation();
 renderChapter();
 renderFigure();
 renderRoutes();
 setStatus(state.chapter?.name ?? "颈部地标总览");
 if (scroll) {
  moveToStudy();
  $("scene-title").focus({preventScroll:true});
 }
}

function renderChapter() {
 const chapter = state.chapter;
 $("below").hidden = !chapter;
 $("detail-title").textContent = chapter ? "沿着路线看" : "在图上认位置";
 $("detail-intro").textContent = chapter?.intro ?? "先看清五个地标，再从上方选一个章节。";
 $("routes").hidden = !chapter;
 if (!chapter) {
  $("route-info").innerHTML = `<div class="notes">${overviewText.map(note).join("")}</div>`;
  return;
 }
 $("notes").innerHTML = chapter.notes.map(note).join("")+`<p class="micro">教材${chapter.source}</p>`;
 $("quiz").innerHTML = chapter.quiz.map((question,index) => `<div class="question" data-question="${index}">
  <p id="question-${index}">${question.ask}</p>
  <div class="answers" role="group" aria-labelledby="question-${index}">${question.options.map((answer,option) =>
   `<button class="choice" data-option="${option}" aria-pressed="false">${answer}</button>`).join("")}</div>
  <div class="feedback" role="status"></div><button class="plain locate" data-locate="${index}" hidden>回到图中看答案</button>
 </div>`).join("");
}

function renderFigure() {
 const figure = currentFigure();
 $("scene-title").textContent = figure.title;
 $("orientation").textContent = figure.orientation;
 $("scene-caption").textContent = figure.caption;
 $("scene-tools").innerHTML = (state.chapter?.views.length>1 ? state.chapter.views : [])
  .map(id => chip(figures[id].name,"view",id,state.view)).join("");
 $("scene-tools").hidden = !$("scene-tools").childElementCount;
 $("duct-key").hidden = state.view!=="jaw";
 $("stage").innerHTML = `<svg class="drawn" viewBox="0 0 480 390" role="${state.chapter?"img":"group"}" aria-labelledby="svg-title svg-description">
  <title id="svg-title">${figure.title}</title><desc id="svg-description">${figure.orientation}。 ${figure.caption}</desc>
  <defs><pattern id="paper-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#839284" stroke-width=".55" opacity=".18"/></pattern></defs>
  <rect x="0" y="0" width="480" height="390" fill="url(#paper-grid)"/>
  ${figure.art()}<g id="trace" aria-hidden="true"></g>
 </svg>`;
 renderTrace();
}

function renderRoutes() {
 if (!state.chapter) {
  $("routes").replaceChildren();
  updateControls();
  return;
 }
 $("routes").innerHTML = state.chapter.routes.map(route =>
  `<button class="route" data-route="${route.id}" aria-pressed="${state.route===route}" style="${cssColor(route.type)}"><i class="dot" aria-hidden="true"></i>${route.name}</button>`).join("");
 renderRouteInfo();
}

function renderRouteInfo() {
 const route = state.route;
 if (!route) {
  $("route-info").innerHTML = "<p>点上方任何一条路线，即可回到它的走向图。</p>";
 } else {
  $("route-info").innerHTML = `<h3>${route.name}</h3><p>${route.purpose}</p><p class="micro">教材${route.source}</p>
   <div class="steps" aria-label="路线步骤">${route.steps.map((step,index) => `<button class="step" data-step="${index}">
    <span class="num" aria-hidden="true">${index+1}</span><span><b>${step.title}</b><small>${step.text}</small></span>
   </button>`).join("")}</div>`;
 }
 updateControls();
}

function changeView(id) {
 halt();
 state.view = id;
 state.route = state.chapter.routes.find(route=>route.view===id) ?? null;
 state.step = 0;
 state.compare = null;
 state.elapsed = 0;
 renderFigure();
 renderRoutes();
 setStatus(currentFigure().title);
 $("scene-tools").querySelector(`[data-view="${id}"]`)?.focus({preventScroll:true});
}

function selectRoute(id,step=0,compare=null) {
 const chosen = state.chapter?.routes.find(route=>route.id===id);
 if (!chosen) return;
 halt();
 const switchView = state.view!==chosen.view;
 state.route = chosen;
 state.step = step;
 state.compare = compare;
 state.elapsed = 0;
 state.view = chosen.view;
 if (switchView) renderFigure();
 else renderTrace();
 $("routes").querySelectorAll("[data-route]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.route===id)));
 renderRouteInfo();
 setStatus(chosen.name + "。 " + chosen.steps[step].title);
}

function changeStep(index) {
 const route = state.route;
 if (!route || index<0 || index>=route.steps.length) return;
 state.step = index;
 state.elapsed = 0;
 state.compare = null;
 renderTrace();
 updateControls();
 setStatus(route.steps[index].title);
}

function updateControls() {
 const route = state.route;
 $("controls").hidden = !route;
 $("stage-step").hidden = !route;
 if (!route) return;
 const last = state.step===route.steps.length-1;
 $("prev").disabled = state.step===0;
 $("next").disabled = last;
 $("play").textContent = state.playing ? "Ⅱ 暂停" : "▶ 播放";
 $("play").setAttribute("aria-label",state.playing?"暂停路线":"播放路线");
 $("counter").textContent = `第 ${state.step+1} / ${route.steps.length} 步`;
 const step = route.steps[state.step];
 $("stage-step").innerHTML = `<b>${step.title}</b>。${step.text}`;
 $("route-info").querySelectorAll("[data-step]").forEach((button,index) => {
  if (index===state.step) button.setAttribute("aria-current","step");
  else button.removeAttribute("aria-current");
 });
}

function svgElement(name, attrs) {
 const node = document.createElementNS(NS,name);
 for (const [key,value] of Object.entries(attrs)) node.setAttribute(key,value);
 return node;
}

function segments(route, step, index) {
 // Split this route at the crossing so the deep portion has an explicit line style.
 if (route.id==="phrenic" && index===2) return [
  {d:"M175 242 Q171 256 166 269"}, {d:"M166 269 Q161 283 156 293",deep:true}, {d:"M156 293 L145 331"}
 ];
 const deep = (route.id==="suba" && index===1) || (route.id==="linguala" && index===1) ||
  (route.id==="ita" && index===1) || (route.id==="vagus" && index!==1);
 return step.paths.map(d=>({d,deep}));
}

function renderTrace() {
 const layer = $("trace");
 layer.replaceChildren();
 traceFrame = [];
 if (!state.route) return;
 const visible = state.chapter.routes.filter(route=>route.view===state.view);
 const ordered = [...visible.filter(route=>route!==state.route),state.route];
 for (const route of ordered) {
  route.steps.forEach((step,index) => {
   const selected = route===state.route;
   const comparison = state.compare?.id===route.id && state.compare.step===index;
   const active = (selected && index===state.step) || comparison;
   const progress = active?"active":selected?(index<state.step?"done":"pending"):"muted";
   for (const {d,deep} of segments(route,step,index)) {
    const color = colors[route.type];
    const lineNode = svgElement("path",{d,stroke:color,"stroke-width":active?4.7:selected?3.4:2.8,
     class:`trace ${route.type} ${progress}${deep?" deep":""}`});
    layer.append(lineNode);
    if (!active) continue;
    const length = lineNode.getTotalLength();
    const end = lineNode.getPointAtLength(length);
    const flow = route.type==="artery" || route.type==="vein" || route.type==="lymph";
    const marker = flow ? svgElement("path",{d:"M-4 -3 L0 0 L-4 3",fill:"none",stroke:color,
     "stroke-width":"2","stroke-linecap":"round","stroke-linejoin":"round",class:"flow"}) :
     svgElement("circle",{cx:0,cy:0,r:3,fill:color,class:"flow"});
    layer.append(svgElement("circle",{cx:end.x,cy:end.y,r:3.6,stroke:color,class:"endpoint"}),marker);
    const item = {lineNode,length,marker,flow,comparison};
    traceFrame.push(item);
    placeMarker(item,0.7);
   }
  });
 }
}

function placeMarker({lineNode,length,marker,flow},fraction) {
 const point = lineNode.getPointAtLength(length*fraction);
 const next = lineNode.getPointAtLength(Math.min(length,length*fraction+1.5));
 const angle = flow ? Math.atan2(next.y-point.y,next.x-point.x)*180/Math.PI : 0;
 marker.setAttribute("transform",`translate(${point.x} ${point.y}) rotate(${angle})`);
}

function halt() {
 state.playing = false;
 if (state.raf) cancelAnimationFrame(state.raf);
 state.raf = 0;
}

function start() {
 if (!state.route || state.playing) return;
 if (state.elapsed>=frameDuration) changeStep(0);
 state.playing = true;
 updateControls();
 let previous = 0;
 const tick = time => {
  state.elapsed += previous ? Math.min(time-previous,100) : 0;
  previous = time;
  if (state.elapsed>=frameDuration) {
   if (state.step+1>=state.route.steps.length) {
    halt();
    traceFrame.forEach(item=>placeMarker(item,.7));
    updateControls();
    setStatus("播放完成。");
    return;
   }
   changeStep(state.step+1);
  }
  if (!reduced.matches) {
   const fraction = .11+.78*((state.elapsed%1800)/1800);
   traceFrame.forEach(item=>placeMarker(item,item.comparison ? .7 : fraction));
  }
  state.raf = requestAnimationFrame(tick);
 };
 state.raf = requestAnimationFrame(tick);
}

function manualStep(index) {
 halt();
 changeStep(index);
 updateControls();
}

function answer(button) {
 const panel = button.closest("[data-question]");
 const question = state.chapter.quiz[Number(panel.dataset.question)];
 const option = Number(button.dataset.option);
 const correct = option===question.correct;
 const choices = panel.querySelectorAll("[data-option]");
 choices.forEach((choice,index)=>{
  choice.classList.toggle("correct",index===question.correct);
  choice.classList.toggle("wrong",index===option && !correct);
  choice.setAttribute("aria-pressed",String(index===option));
 });
 panel.querySelector(".feedback").textContent = (correct?"答对了。":"再看一下这个关系。")+question.reason;
 panel.querySelector("[data-locate]").hidden = false;
 highlightAnswer(question);
}

function highlightAnswer(question) {
 const compare = question.route==="suba" ? {id:"plexus",step:1} : null;
 selectRoute(question.route,question.step,compare);
}

$("lessons").addEventListener("click",event=>{
 const button = event.target.closest("[data-chapter]");
 if (button) loadChapter(button.dataset.chapter);
});
$("stage").addEventListener("click",event=>{
 const button = event.target.closest("[data-chapter]");
 if (button) loadChapter(button.dataset.chapter);
});
$("stage").addEventListener("keydown",event=>{
 const button = event.target.closest("[data-chapter]");
 if (button && ["Enter"," "].includes(event.key)) {
  event.preventDefault();
  loadChapter(button.dataset.chapter);
 }
});
$("overview").addEventListener("click",()=>{loadChapter(null,false);window.scrollTo(0,0);});
$("routes").addEventListener("click",event=>{
 const button = event.target.closest("[data-route]");
 if (button) selectRoute(button.dataset.route);
});
$("scene-tools").addEventListener("click",event=>{
 const button = event.target.closest("[data-view]");
 if (button && state.view!==button.dataset.view) changeView(button.dataset.view);
});
$("route-info").addEventListener("click",event=>{
 const button = event.target.closest("[data-step]");
 if (button) manualStep(Number(button.dataset.step));
});
$("play").addEventListener("click",()=>{
 if (state.playing) { halt(); updateControls(); }
 else start();
});
$("prev").addEventListener("click",()=>manualStep(state.step-1));
$("next").addEventListener("click",()=>manualStep(state.step+1));
$("replay").addEventListener("click",()=>{ manualStep(0); start(); });
$("quiz").addEventListener("click",event=>{
 const option = event.target.closest("[data-option]");
 const locate = event.target.closest("[data-locate]");
 if (option) answer(option);
 if (locate) {
  highlightAnswer(state.chapter.quiz[Number(locate.dataset.locate)]);
  moveToStudy();
  $("scene-title").focus({preventScroll:true});
 }
});
document.addEventListener("visibilitychange",()=>{
 if (document.hidden && state.playing) { halt(); updateControls(); }
});
if (narrow.addEventListener) narrow.addEventListener("change",moveRoutePicker);
else narrow.addListener(moveRoutePicker);
$("scene-title").tabIndex = -1;
moveRoutePicker();
loadChapter(null,false);

</script>
